<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | AgriConnect SA</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet" href="css/animations.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/chatbot.css">
</head>

<body>

<header>

<div class="logo">
<h2>🌱 AgriConnect SA</h2>
</div>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="products.html">Marketplace</a></li>

<li><a href="cart.html">🛒 <span id="cart-count">0</span></a></li>


</ul>

</nav>

</header>

<section class="featured">

<h2>Your Shopping Cart</h2>

<table class="cart-table">

<thead>

<tr>

<th>Product</th>

<th>Price</th>

<th>Quantity</th>

<th>Total</th>

<th>Action</th>

</tr>

</thead>

<tbody id="cart-items">

</tbody>

</table>

<div class="summary">

<h3>Order Summary</h3>

<p>Subtotal: <span id="subtotal">R0</span></p>

<p>VAT (15%): <span id="vat">R0</span></p>

<p>Delivery: <span id="delivery">R80</span></p>

<hr>

<h2>Total: <span id="grand-total">R0</span></h2>

<a href="checkout.html" class="btn">

Proceed to Checkout

</a>

</div>

</section>

<script src="js/cart.js"></script>

<script src="js/app.js"></script>

<script src="js/chatbot.js"></script>
</body>

</html>
